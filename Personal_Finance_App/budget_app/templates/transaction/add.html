{% extends "base.html" %}

{% block title %}거래 추가 - 박마토의 가계부{% endblock %}

{% block content %}
<div class="form-page">
    <div class="page-header">
        <h2 class="page-title">거래 추가</h2>
        <a href="{{ url_for('transaction.list') }}" class="btn btn-secondary">← 목록으로</a>
    </div>

    <form method="POST" action="{{ url_for('transaction.add') }}" class="transaction-form">
        <div class="form-section">
            <h3 class="form-section-title">기본 정보</h3>

            <div class="form-row">
                <div class="form-group">
                    <label for="transaction_type" class="required">거래 유형</label>
                    <select name="transaction_type" id="transaction_type" required onchange="filterCategories()">
                        <option value="expense">지출</option>
                        <option value="income">수입</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date" class="required">날짜</label>
                    <input type="date" name="date" id="date" value="{{ today }}" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group full-width">
                    <label for="description" class="required">내용</label>
                    <input type="text" name="description" id="description" placeholder="예: 점심 식사, 월급 등" required maxlength="200">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="amount" class="required">금액</label>
                    <input type="number" name="amount" id="amount" placeholder="0" required min="0" step="1">
                    <small class="form-hint">원 단위로 입력해주세요.</small>
                </div>

                <div class="form-group">
                    <label for="category_id" class="required">카테고리</label>
                    <select name="category_id" id="category_id" required>
                        <option value="">선택하세요</option>
                        {% for cat in categories %}
                        <option value="{{ cat.category_id }}" data-type="{{ cat.category_type }}">
                            {{ cat.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="payment_method_id" class="required">걸제 수단</label>
                    <select name="payment_method_id" id="payment_method_id" required>
                        <option value="">선택하세요.</option>
                        {% for pm in payment_methods %}
                        <option value="{{ pm.payment_method_id }}">{{ pm.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" name="is_fixed" id="is_fixed">
                        <label for="is_fixed">고정 지출/수입</label>
                    </div>
                    <small class="form-hint">매달 정기적으로 발생하는 항목</small>
                </div>
            </div>
        </div>

        <div class="form-section">
            <h3 class="form-section-title">추가 정보</h3>

            <div class="form-group full-width">
                <label for="memo">메모</label>
                <textarea name="memo" id="memo" rows="4" placeholder="추가 메모를 입력하세요 (선택사항)"></textarea>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary btn-lg">저장하기</button>
            <a href="{{ url_for('transaction.list') }}" class="btn btn-secondary btn-lg">취소</a>
        </div>
    </form>
</div>

<script>
// 거래 유형에 따라 카테고리 필터링
function filterCategories() {
    const type = document.getElementById('transaction_type').value;
    const categorySelect = document.getElementById('category_id');
    const options = categorySelect.querySelectorAll('option');

    options.forEach(option => {
        if (option.value === '') {
            option.style.display = 'block';
            return;
        }

        const optionType = option.getAttribute('data-type');
        if (optionType === type) {
            option.style.display = 'block';
        } else {
            option.style.display = 'none';
        }
    });

    // 현재 선택된 옵션이 숨겨진 경우 초기화
    const selectedOption = categorySelect.options[categorySelect.selectedIndex];
    if (selectedOption && selectedOption.style.display === 'none') {
        categorySelect.value = '';
    }
}

// 페이지 로드 시 필터 적용
window.addEventListener('DOMContentLoaded', filterCategories);
</script>
{% endblock %}
